services:
  mysql:
    image: mysql:8.0
    container_name: sih26107-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sih26107
      MYSQL_USER: sih
      MYSQL_PASSWORD: sihpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psihpassword", "-usih"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih26107-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://sih:sihpassword@mysql:3306/sih26107
      CHROMA_PATH: /app/storage/chroma
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - backend_storage:/app/storage
    profiles: ["full"]

volumes:
  mysql_data:
  backend_storage:
