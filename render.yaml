# Render blueprint for the SIH26107 backend.
#   1. Create a MongoDB deployment (MongoDB Atlas, or any managed MongoDB).
#   2. Set MONGO_URI in the dashboard (mongodb+srv://USER:PASSWORD@HOST/).
#      Atlas URIs carry no database name, so set MONGO_DB_NAME as well.
#      Allow the Render egress IPs in the Atlas network access list.
#   3. Deploy this blueprint, then run the demo setup once from the shell:
#        python scripts/setup_demo.py
services:
  - type: web
    name: sih26107-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGO_URI
        sync: false          # set in the dashboard; never commit a connection string
      - key: MONGO_DB_NAME
        value: sih26107
      - key: MONGO_TIMEOUT_MS
        value: "8000"
      - key: FRONTEND_URL
        sync: false          # the deployed frontend origin, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
    # Uploaded evidence files only - the vector index lives in MongoDB.
    disk:
      name: sih26107-storage
      mountPath: /app/storage
      sizeGB: 1
